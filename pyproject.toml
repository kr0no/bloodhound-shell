[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "bhshell"
dynamic = ["version"]
description = "Interactive shell for BloodHound"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "kr0no", email = "kr0no@ka0labs.net" }]
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = [
    "bloodhound",
    "bloodhound-ce",
    "active-directory",
    "attack-paths",
    "cypher",
    "pentest",
    "red-team",
    "security",
    "cli",
    "shell",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "cmd2>=4.3,<5",
    "rich>=13.0",
    "requests>=2.31",
    "resvg-py>=0.5",
]

[project.urls]
Homepage = "https://github.com/kr0no/bloodhound-shell"
Issues = "https://github.com/kr0no/bloodhound-shell/issues"
Changelog = "https://github.com/kr0no/bloodhound-shell/blob/main/CHANGELOG.md"
Author = "https://kr0no.me"

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25", "ruff==0.17.1", "pre-commit>=4.0"]

[project.scripts]
bhshell = "bhshell.cli:main"

[tool.setuptools.packages.find]
include = ["bhshell*"]

[tool.setuptools.package-data]
bhshell = ["library/*.cyp"]

# The version comes from the latest v* git tag.
[tool.setuptools_scm]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
markers = ["live: needs a BloodHound server with the sample data (BHSHELL_TEST_URL)"]
