name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" "ruff==0.17.0"
      - run: ruff check bhshell tests
      - run: pytest

  # Pushing a tag like v0.2.0 publishes that commit to PyPI, once every test job has passed.
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no API token is stored anywhere
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the tag matches bhshell.__version__
        run: |
          version=$(python -c "import bhshell; print(bhshell.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match bhshell.__version__ ($version)"
            exit 1
          fi
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
