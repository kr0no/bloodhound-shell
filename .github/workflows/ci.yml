name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the git tags
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check bhshell tests
      - run: pytest

  # Builds the sdist and wheel, then installs the wheel outside the source tree to check it runs.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the git tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - name: Install the wheel in a clean venv and run it
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv smoke
          smoke/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          smoke/bin/bhshell --version
          smoke/bin/python -c "
          import importlib, pkgutil, bhshell
          for m in pkgutil.walk_packages(bhshell.__path__, 'bhshell.'):
              if m.name != 'bhshell.__main__':  # importing it starts the shell
                  importlib.import_module(m.name)
          "
          expected=$(ls "$GITHUB_WORKSPACE"/bhshell/library/*.cyp | wc -l)
          installed=$(smoke/bin/python -c "from bhshell.queries.library import BUILTIN_DIR; print(len(list(BUILTIN_DIR.glob('*.cyp'))))")
          if [ "$installed" -ne "$expected" ]; then
            echo "::error::The wheel has $installed of $expected library/*.cyp files"
            exit 1
          fi
      - name: Check the version matches the tag and has a CHANGELOG entry
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ runner.temp }}
        run: |
          version=$(smoke/bin/python -c "import bhshell; print(bhshell.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Built version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[|^\[[^]]+\]: / { exit }
            found { print }
          ' "$GITHUB_WORKSPACE/CHANGELOG.md" > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md

  publish:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Runs after PyPI accepted the upload, so a GitHub release always matches a published version.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --notes-file artifacts/release-notes/notes.md --verify-tag
